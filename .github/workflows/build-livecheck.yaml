# Build and publish `emsui-livecheck` container image to ghcr.io.
#
# This repository is public only so GitHub-hosted runners are free; it holds no
# source. The workflow checks the private source out of Forgejo with a read-only
# token (`secrets.FORGEJO`), writes the Global CA client identity, builds the
# container image via Docker Buildx, and publishes to ghcr.io/vessel9457/emsui-livecheck.
#
# A Forgejo Action dispatches this via `workflow_dispatch` and waits for the run.

name: build-livecheck

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Forgejo commit SHA (or ref) to build
        required: false
        default: main
      correlation_id:
        description: Caller correlation id (echoed in the run name)
        required: false
      tag:
        description: Optional extra image tag (e.g. v0.1.0)
        required: false

run-name: "build-livecheck ${{ inputs.correlation_id || github.sha }}"

permissions:
  contents: read
  packages: write

env:
  FJ_HOST: git.delnegend.com
  FJ_OWNER: Delnegend
  IMAGE_NAME: ghcr.io/vessel9457/emsui-livecheck

jobs:
  build:
    name: Build & Publish Image
    runs-on: ubuntu-latest
    steps:
      - name: Fetch source from Forgejo
        env:
          TOKEN: ${{ secrets.FORGEJO }}
          REF: ${{ inputs.ref || 'main' }}
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY#*/}"
          git clone "https://oauth2:${TOKEN}@${FJ_HOST}/${FJ_OWNER}/${REPO}.git" .
          git remote set-url origin "https://${FJ_HOST}/${FJ_OWNER}/${REPO}.git"
          git checkout "$REF"

      - name: Write Global CA client identity
        env:
          GLOBAL_CLIENT_CRT: ${{ secrets.GLOBAL_CLIENT_CRT }}
          GLOBAL_CLIENT_KEY: ${{ secrets.GLOBAL_CLIENT_KEY }}
        run: |
          set -euo pipefail
          [ -n "${GLOBAL_CLIENT_CRT:-}" ] && [ -n "${GLOBAL_CLIENT_KEY:-}" ] || {
            echo "::error::set the GLOBAL_CLIENT_CRT and GLOBAL_CLIENT_KEY repository secrets"
            exit 1
          }
          mkdir -p certs
          printf '%s\n' "$GLOBAL_CLIENT_CRT" > certs/global_client.crt
          printf '%s\n' "$GLOBAL_CLIENT_KEY" > certs/global_client.key

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve SemVer and compute image tags
        id: tags
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short HEAD)"

          # 1. Determine SemVer: explicit input tag -> git tag -> Cargo.toml
          RAW_TAG="${{ inputs.tag }}"
          if [ -n "$RAW_TAG" ]; then
            SEMVER="${RAW_TAG#v}"
          elif TAG="$(git describe --tags --match 'v*' --exact-match 2>/dev/null)"; then
            SEMVER="${TAG#v}"
          else
            SEMVER="$(grep -m1 '^version =' Cargo.toml | cut -d'"' -f2)"
          fi

          echo "resolved semver: $SEMVER"
          echo "version=${SEMVER}" >> "$GITHUB_OUTPUT"

          # 2. Extract major & minor
          MAJOR="$(echo "$SEMVER" | cut -d. -f1)"
          MINOR="$(echo "$SEMVER" | cut -d. -f2)"

          # 3. Update Cargo.toml if different so the binary embeds the exact semver
          CURR_VER="$(grep -m1 '^version =' Cargo.toml | cut -d'"' -f2)"
          if [ "$CURR_VER" != "$SEMVER" ]; then
            sed -i -E "0,/^version = \".*\"/s//version = \"${SEMVER}\"/" Cargo.toml
          fi

          # 4. Assemble tags
          TAGS="${IMAGE_NAME}:latest,${IMAGE_NAME}:v${SEMVER},${IMAGE_NAME}:${SEMVER},${IMAGE_NAME}:${MAJOR}.${MINOR},${IMAGE_NAME}:${MAJOR},${IMAGE_NAME}:${SHORT_SHA}"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/emsui-livecheck/Dockerfile
          push: true
          build-args: VERSION=${{ steps.tags.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
