# CI gate for the private Forgejo repo `Delnegend/emsui-agent`.
#
# This repository is public only so GitHub-hosted runners are free; it holds no
# source. The workflow checks the private source out of Forgejo with a read-only
# token (`secrets.FORGEJO`) and runs the single `just check` gate. Building and
# shipping binaries is the Release workflow's job.
#
# A Forgejo Action dispatches this via `workflow_dispatch` and waits for the run.

name: ci

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Forgejo commit SHA (or ref) to build
        required: false
        default: main
      correlation_id:
        description: Caller correlation id (echoed in the run name)
        required: false

run-name: "ci ${{ inputs.correlation_id || github.sha }}"

# Queued CI runs are redundant: the newer run checks a superset of the
# older's commits. Cancel the stale run instead of burning two runners on
# back-to-back pushes. (Releases serialize separately in `release.yaml` and
# must never cancel.)
# NOTE: the group MUST be a stable key. Grouping on `inputs.ref` (a unique
# commit SHA per dispatch) or `inputs.correlation_id` (unique per trigger)
# never collides, so `cancel-in-progress` would be dead code. This repo only
# builds `main` on a single branch, so a static group is correct.
concurrency:
  group: ci-main
  cancel-in-progress: true

permissions:
  contents: read

env:
  FJ_HOST: git.delnegend.com
  FJ_OWNER: Delnegend

jobs:
  check:
    name: Check (just check)
    runs-on: ubuntu-latest
    steps:
      - name: Fetch source from Forgejo
        uses: Vessel9457/actions/checkout@v2
        with:
          token: ${{ secrets.FORGEJO }}
          repository: ${{ env.FJ_OWNER }}/${{ github.event.repository.name }}
          server_url: https://${{ env.FJ_HOST }}
          ref: ${{ inputs.ref || 'main' }}

      - name: Write Global CA client identity
        env:
          GLOBAL_CLIENT_CRT: ${{ secrets.GLOBAL_CLIENT_CRT }}
          GLOBAL_CLIENT_KEY: ${{ secrets.GLOBAL_CLIENT_KEY }}
        run: |
          set -euo pipefail
          [ -n "${GLOBAL_CLIENT_CRT:-}" ] && [ -n "${GLOBAL_CLIENT_KEY:-}" ] || {
            echo "::error::set the GLOBAL_CLIENT_CRT and GLOBAL_CLIENT_KEY repository secrets"
            exit 1
          }
          mkdir -p .certs
          printf '%s\n' "$GLOBAL_CLIENT_CRT" > .certs/global_client.crt
          printf '%s\n' "$GLOBAL_CLIENT_KEY" > .certs/global_client.key

      - name: Install clang + mold
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends clang mold

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3

      - name: Run checks
        run: just check
