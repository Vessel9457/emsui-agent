# Release for the private Forgejo repo `Delnegend/emsui-agent`.
#
# Three targets, dispatched by the Forgejo `release` workflow:
#   new-tag (default) — dispatched with the new `vX.Y.Z` tag; builds the tag
#     and publishes artifacts.
#   tag    — rebuild an existing tag (repair path); builds and publishes.
#   commit — test-build a commit SHA; artifacts go to the Actions run only,
#     no GitHub Release, no container push.
# Artifacts (CLI binaries and container image) publish to GitHub Releases and
# GitHub Container Registry (ghcr.io).
# The Forgejo action mirrors the binary release back to Forgejo.

name: release

on:
  workflow_dispatch:
    inputs:
      target:
        description: Release mode / build target
        required: true
        type: choice
        default: new-tag
        options:
          - new-tag
          - tag
          - commit
      ref:
        description: Tag (new-tag/tag) or commit SHA (commit)
        required: true
      correlation_id:
        description: Caller correlation id (echoed in the run name)
        required: false

run-name: "release ${{ inputs.correlation_id || github.sha }}"

# Serialise releases: concurrent runs on the same tag would race on one
# GitHub Release.
concurrency:
  group: release-main
  cancel-in-progress: false

env:
  FJ_HOST: git.delnegend.com
  FJ_OWNER: Delnegend
  BINARY_PREFIX: emsui-agent
  IMAGE_NAME: ghcr.io/vessel9457/emsui-admincheck

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      target_ref: ${{ steps.resolve.outputs.target_ref }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - name: Resolve Version and Publish Flag
        id: resolve
        env:
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail

          if [ "$INPUT_TARGET" = "commit" ]; then
            # Test build: any commit SHA, no tag, no version, no publish.
            echo "$INPUT_REF" | grep -qE '^[0-9a-f]{4,64}$' || { echo "::error::commit target needs a commit SHA, got '${INPUT_REF}'"; exit 1; }
            echo "version=$INPUT_REF" >> "$GITHUB_OUTPUT"
            echo "target_ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "test build against commit $INPUT_REF (will not publish)"
            exit 0
          fi

          # new-tag and tag both build a version tag and publish.
          if echo "$INPUT_REF" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            VER="${INPUT_REF#v}"
            echo "version=$VER" >> "$GITHUB_OUTPUT"
            echo "target_ref=${INPUT_REF}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "resolved version: $VER (from input ref $INPUT_REF)"
            exit 0
          fi

          echo "::error::tag target needs a version tag (e.g. v0.2.0), got '${INPUT_REF}'"
          exit 1

      - name: Fail if this version was already released
        if: steps.resolve.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "v${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::release v${VERSION} already exists on ${GITHUB_REPOSITORY} — delete it first (gh release delete v${VERSION} --repo ${GITHUB_REPOSITORY} --yes), then re-run"
            exit 1
          fi
          echo "no existing release v${VERSION}; proceeding"

  build:
    name: Build Binaries (x86_64-unknown-linux-musl + GUI glibc)
    needs: prepare
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Fetch source from Forgejo
        uses: Vessel9457/actions/checkout@v2 # tracks Delnegend/actions  # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag
        with:
          token: ${{ secrets.FORGEJO }}
          repository: ${{ env.FJ_OWNER }}/${{ github.event.repository.name }}
          server_url: https://${{ env.FJ_HOST }}
          ref: ${{ needs.prepare.outputs.target_ref }}

      - name: Write Global CA client identity
        env:
          GLOBAL_CLIENT_CRT: ${{ secrets.GLOBAL_CLIENT_CRT }}
          GLOBAL_CLIENT_KEY: ${{ secrets.GLOBAL_CLIENT_KEY }}
        run: |
          set -euo pipefail
          [ -n "${GLOBAL_CLIENT_CRT:-}" ] && [ -n "${GLOBAL_CLIENT_KEY:-}" ] || {
            echo "::error::set the GLOBAL_CLIENT_CRT and GLOBAL_CLIENT_KEY repository secrets"
            exit 1
          }
          mkdir -p .certs
          printf '%s\n' "$GLOBAL_CLIENT_CRT" > .certs/global_client.crt
          printf '%s\n' "$GLOBAL_CLIENT_KEY" > .certs/global_client.key

      - name: Update Cargo.toml workspace version
        if: needs.prepare.outputs.publish == 'true'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          sed -i -E "0,/^version = \".*\"/s//version = \"${VERSION}\"/" Cargo.toml
          python3 -c "
          import re, os
          v = os.environ['VERSION']
          with open('Cargo.lock', 'r') as f:
              content = f.read()
          content = re.sub(r'(name = \"emsui-[^\"]+\"\nversion = )\"[^\"]+\"', rf'\g<1>\"{v}\"', content)
          with open('Cargo.lock', 'w') as f:
              f.write(content)
          "

      - name: Install clang + mold + musl toolchain + GTK4/Adwaita libs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends clang mold musl-tools libgtk-4-dev libadwaita-1-dev
          sudo ln -sf /usr/bin/musl-gcc /usr/local/bin/x86_64-linux-musl-gcc

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: x86_64-unknown-linux-musl

      - name: Synchronize Cargo.lock (musl, no GUI)
        run: |
          set -euo pipefail
          # emsui-linux needs system GTK (glibc): it never links static musl.
          cargo check --workspace --exclude emsui-linux --target x86_64-unknown-linux-musl

      - name: Build (musl, no GUI)
        env:
          RUSTFLAGS: "-C linker=clang -C link-arg=--target=x86_64-unknown-linux-musl -C link-arg=-fuse-ld=mold"
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          set -euo pipefail
          cargo build --workspace --exclude emsui-linux --release --target x86_64-unknown-linux-musl \
            --message-format=json-render-diagnostics > cargo-build-musl.json

      - name: Build GUI (glibc, system GTK)
        run: |
          set -euo pipefail
          cargo build -p emsui-linux --release \
            --message-format=json-render-diagnostics > cargo-build-gui.json

      - name: Package
        env:
          REF_SLUG: ${{ needs.prepare.outputs.target_ref }}
          PUBLISH: ${{ needs.prepare.outputs.publish }}
          APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          # Test builds (commit target) have no version: name the tarball by short SHA.
          if [ "$PUBLISH" = "true" ]; then
            BASE="${BINARY_PREFIX}-${APP_VERSION}-linux"
          else
            BASE="${BINARY_PREFIX}-${REF_SLUG}-linux"
          fi
          mkdir -p "$BASE"
          while read -r exe; do
            cp "$exe" "$BASE/" || exit 1
          done < <(jq -r 'select(.reason == "compiler-artifact" and .executable != null) | .executable' cargo-build-musl.json cargo-build-gui.json | sort -u)
          [ "$(ls -A "$BASE")" ] || { echo "::error::no executables packaged"; exit 1; }
          tar -czf "${BASE}.tar.gz" "$BASE"
          rm -rf "$BASE"
          ls -lh "${BASE}.tar.gz"
          echo "ASSET=${BASE}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload test-build artifacts
        if: needs.prepare.outputs.publish != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-artifacts-${{ needs.prepare.outputs.target_ref }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

      - name: Create GitHub Release on Vessel9457
        if: needs.prepare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: v${{ needs.prepare.outputs.version }}
          TARGET_REF: ${{ needs.prepare.outputs.target_ref }}
        run: |
          set -euo pipefail
          # The workspace's `origin` points at Forgejo, so `gh` cannot infer the
          # repository — pass it explicitly.
          gh release create "$VERSION" "${ASSET}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "$VERSION" \
            --notes "To be disclosed"

  publish-image:
    name: Publish Container Image (ghcr.io)
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Fetch source from Forgejo
        uses: Vessel9457/actions/checkout@v2 # tracks Delnegend/actions  # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag
        with:
          token: ${{ secrets.FORGEJO }}
          repository: ${{ env.FJ_OWNER }}/${{ github.event.repository.name }}
          server_url: https://${{ env.FJ_HOST }}
          ref: ${{ needs.prepare.outputs.target_ref }}

      - name: Write Global CA client identity
        env:
          GLOBAL_CLIENT_CRT: ${{ secrets.GLOBAL_CLIENT_CRT }}
          GLOBAL_CLIENT_KEY: ${{ secrets.GLOBAL_CLIENT_KEY }}
        run: |
          set -euo pipefail
          [ -n "${GLOBAL_CLIENT_CRT:-}" ] && [ -n "${GLOBAL_CLIENT_KEY:-}" ] || {
            echo "::error::set the GLOBAL_CLIENT_CRT and GLOBAL_CLIENT_KEY repository secrets"
            exit 1
          }
          mkdir -p .certs
          printf '%s\n' "$GLOBAL_CLIENT_CRT" > .certs/global_client.crt
          printf '%s\n' "$GLOBAL_CLIENT_KEY" > .certs/global_client.key

      - name: Update Cargo.toml workspace version
        if: needs.prepare.outputs.publish == 'true'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          sed -i -E "0,/^version = \".*\"/s//version = \"${VERSION}\"/" Cargo.toml
          python3 -c "
          import re, os
          v = os.environ['VERSION']
          with open('Cargo.lock', 'r') as f:
              content = f.read()
          content = re.sub(r'(name = \"emsui-[^\"]+\"\nversion = )\"[^\"]+\"', rf'\g<1>\"{v}\"', content)
          with open('Cargo.lock', 'w') as f:
              f.write(content)
          "

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          # Only two tags are published: `latest` and the full semver.
          TAGS="${IMAGE_NAME}:latest,${IMAGE_NAME}:${VERSION}"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push container image
        if: needs.prepare.outputs.publish == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/emsui-admincheck/Dockerfile
          push: true
          build-args: VERSION=${{ needs.prepare.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
