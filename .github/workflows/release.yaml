# Release for the private Forgejo repo `Delnegend/emsui-agent`.
#
# The version is computed by ietf-tools/semver-action from the source repo's
# Conventional Commits since the last release; artifacts (CLI binaries and
# emsui-livecheck container image) are built here and published to Vessel9457's
# GitHub Releases and GitHub Container Registry (ghcr.io).
# The Forgejo action mirrors the binary release back to Forgejo.

name: release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Forgejo release tag (e.g. v0.2.0) or ref to release (defaults to latest tag)
        required: false
        default: ''
      correlation_id:
        description: Caller correlation id (echoed in the run name)
        required: false

run-name: "release ${{ inputs.correlation_id || github.sha }}"

# Serialise releases so tag creation cannot collide.
concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  FJ_HOST: git.delnegend.com
  FJ_OWNER: Delnegend
  BINARY_PREFIX: emsui-agent
  IMAGE_NAME: ghcr.io/vessel9457/emsui-livecheck

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version || steps.semver.outputs.nextStrict }}
      target_ref: ${{ steps.version.outputs.target_ref || steps.semver.outputs.next }}
      skip: ${{ steps.version.outputs.skip || steps.changes.outputs.skip }}
    steps:
      # GitHub's runner only resolves `owner/repo@ref`, `./path`, or
      # `docker://` — the `https://host/owner/repo@ref` form is a Forgejo
      # extension, so the Forgejo-hosted `Delnegend/actions/checkout` cannot be
      # used here. Clone inline instead.
      - name: Fetch source from Forgejo
        env:
          TOKEN: ${{ secrets.FORGEJO }}
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY#*/}"
          CLONE_URL="https://oauth2:${TOKEN}@${FJ_HOST}/${FJ_OWNER}/${REPO}.git"
          for i in 1 2 3 4 5; do
            rm -rf src
            if git clone --quiet "$CLONE_URL" src; then
              break
            fi
            if [ "$i" -eq 5 ]; then
              echo "::error::git clone failed after 5 attempts"
              exit 1
            fi
            echo "git clone failed (attempt $i), retrying in $((i * 3))s..."
            sleep $((i * 3))
          done
          if [ -n "$REF" ]; then
            git -C src checkout --quiet "$REF"
          else
            LATEST_TAG="$(git -C src tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 || true)"
            if [ -n "$LATEST_TAG" ]; then
              echo "No ref specified; defaulting to latest verified release tag: $LATEST_TAG"
              git -C src checkout --quiet "$LATEST_TAG"
            else
              echo "No tag found; using main"
              git -C src checkout --quiet main
            fi
          fi

      - name: Resolve Version from ref, tag, or Cargo.toml
        id: version
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail

          # 1. If input ref is a version tag (e.g. v0.2.0 or 0.2.0), use it directly
          if echo "$INPUT_REF" | grep -qE '^v?[0-9]+\.[0-9]+\.[0-9]+'; then
            VER="${INPUT_REF#v}"
            echo "version=$VER" >> "$GITHUB_OUTPUT"
            echo "target_ref=${INPUT_REF}" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "resolved version: $VER (from input ref $INPUT_REF)"
            exit 0
          fi

          # 2. Check if git commit has an exact tag
          TAG="$(git -C src describe --tags --match 'v*' --exact-match 2>/dev/null || true)"
          if [ -n "$TAG" ]; then
            VER="${TAG#v}"
            echo "version=$VER" >> "$GITHUB_OUTPUT"
            echo "target_ref=${TAG}" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "resolved version: $VER (from exact git tag $TAG)"
            exit 0

          # 3. Check if Cargo.toml on this commit is already bumped beyond the latest tag
          LAST="$(git -C src describe --tags --match 'v*' --abbrev=0 2>/dev/null || true)"
          CARGO_VER="$(grep -m1 '^version =' src/Cargo.toml | cut -d'"' -f2)"
          if [ -n "$LAST" ] && [ "$CARGO_VER" != "${LAST#v}" ]; then
            echo "version=$CARGO_VER" >> "$GITHUB_OUTPUT"
            echo "target_ref=v${CARGO_VER}" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "resolved version: $CARGO_VER (from bumped Cargo.toml)"
            exit 0

          echo "need_semver=true" >> "$GITHUB_OUTPUT"
      - name: Collect source commits since the last release
        id: changes
        if: steps.version.outputs.need_semver == 'true'
        run: |
          set -euo pipefail
          LAST="$(git -C src describe --tags --match 'v*' --abbrev=0 2>/dev/null || true)"
          if [ -n "$LAST" ]; then RANGE="${LAST}..HEAD"; else RANGE="HEAD"; fi

          COUNT="$(git -C src rev-list --count "$RANGE")"
          echo "source commits since ${LAST:-the beginning}: ${COUNT}"
          if [ "$COUNT" -eq 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          {
            echo 'messages<<EOF'
            git -C src log --pretty=format:%s "$RANGE"
            echo
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Next version (fallback)
        id: semver
        if: steps.version.outputs.need_semver == 'true' && steps.changes.outputs.skip != 'true'
        uses: ietf-tools/semver-action@v1
        with:
          token: ${{ github.token }}
          fallbackTag: v0.0.0
          additionalCommits: ${{ steps.changes.outputs.messages }}
          noVersionBumpBehavior: patch

  build:
    name: Build Binaries (x86_64-unknown-linux-musl)
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      # GitHub's runner only resolves `owner/repo@ref`, `./path`, or
      # `docker://` — the `https://host/owner/repo@ref` form is a Forgejo
      # extension, so the Forgejo-hosted `Delnegend/actions/checkout` cannot be
      # used here. Clone inline instead.
      - name: Fetch source from Forgejo
        env:
          TOKEN: ${{ secrets.FORGEJO }}
          REF: ${{ needs.prepare.outputs.target_ref }}
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY#*/}"
          CLONE_URL="https://oauth2:${TOKEN}@${FJ_HOST}/${FJ_OWNER}/${REPO}.git"
          for i in 1 2 3 4 5; do
            find . -mindepth 1 -delete
            if git clone "$CLONE_URL" .; then
              break
            fi
            if [ "$i" -eq 5 ]; then
              echo "::error::git clone failed after 5 attempts"
              exit 1
            fi
            echo "git clone failed (attempt $i), retrying in $((i * 3))s..."
            sleep $((i * 3))
          done
          git remote set-url origin "https://${FJ_HOST}/${FJ_OWNER}/${REPO}.git"
          git checkout "$REF"

      - name: Write Global CA client identity
        env:
          GLOBAL_CLIENT_CRT: ${{ secrets.GLOBAL_CLIENT_CRT }}
          GLOBAL_CLIENT_KEY: ${{ secrets.GLOBAL_CLIENT_KEY }}
        run: |
          set -euo pipefail
          [ -n "${GLOBAL_CLIENT_CRT:-}" ] && [ -n "${GLOBAL_CLIENT_KEY:-}" ] || {
            echo "::error::set the GLOBAL_CLIENT_CRT and GLOBAL_CLIENT_KEY repository secrets"
            exit 1
          }
          mkdir -p certs
          printf '%s\n' "$GLOBAL_CLIENT_CRT" > certs/global_client.crt
          printf '%s\n' "$GLOBAL_CLIENT_KEY" > certs/global_client.key

      - name: Update Cargo.toml workspace version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          sed -i -E "0,/^version = \".*\"/s//version = \"${VERSION}\"/" Cargo.toml
          python3 -c "
          import re, os
          v = os.environ['VERSION']
          with open('Cargo.lock', 'r') as f:
              content = f.read()
          content = re.sub(r'(name = \"emsui-[^\"]+\"\nversion = )\"[^\"]+\"', rf'\g<1>\"{v}\"', content)
          with open('Cargo.lock', 'w') as f:
              f.write(content)
          "

      - name: Install clang + mold + musl toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends clang mold musl-tools
          sudo ln -sf /usr/bin/musl-gcc /usr/local/bin/x86_64-linux-musl-gcc

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-musl

      - name: Synchronize Cargo.lock
        run: |
          set -euo pipefail
          cargo check --workspace --target x86_64-unknown-linux-musl

      - name: Build
        env:
          RUSTFLAGS: "-C linker=clang -C link-arg=--target=x86_64-unknown-linux-musl -C link-arg=-fuse-ld=mold"
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          set -euo pipefail
          cargo build --workspace --release --target x86_64-unknown-linux-musl \
            --message-format=json-render-diagnostics > cargo-build.json

      - name: Package
        run: |
          set -euo pipefail
          BASE="${BINARY_PREFIX}-${{ needs.prepare.outputs.version }}-linux-musl"
          mkdir -p "$BASE"
          jq -r 'select(.reason == "compiler-artifact" and .executable != null) | .executable' \
            cargo-build.json | sort -u | while read -r exe; do
              cp "$exe" "$BASE/"
            done
          tar -czf "${BASE}.tar.gz" "$BASE"
          rm -rf "$BASE"
          ls -lh "${BASE}.tar.gz"
          echo "ASSET=${BASE}.tar.gz" >> "$GITHUB_ENV"


      - name: Create GitHub Release on Vessel9457
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: v${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" "${ASSET}" \
            --title "$VERSION" \
            --generate-notes

  publish-image:
    name: Publish Container Image (ghcr.io)
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # GitHub's runner only resolves `owner/repo@ref`, `./path`, or
      # `docker://` — the `https://host/owner/repo@ref` form is a Forgejo
      # extension, so the Forgejo-hosted `Delnegend/actions/checkout` cannot be
      # used here. Clone inline instead.
      - name: Fetch source from Forgejo
        env:
          TOKEN: ${{ secrets.FORGEJO }}
          REF: ${{ needs.prepare.outputs.target_ref }}
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY#*/}"
          CLONE_URL="https://oauth2:${TOKEN}@${FJ_HOST}/${FJ_OWNER}/${REPO}.git"
          for i in 1 2 3 4 5; do
            find . -mindepth 1 -delete
            if git clone "$CLONE_URL" .; then
              break
            fi
            if [ "$i" -eq 5 ]; then
              echo "::error::git clone failed after 5 attempts"
              exit 1
            fi
            echo "git clone failed (attempt $i), retrying in $((i * 3))s..."
            sleep $((i * 3))
          done
          git remote set-url origin "https://${FJ_HOST}/${FJ_OWNER}/${REPO}.git"
          git checkout "$REF"

      - name: Write Global CA client identity
        env:
          GLOBAL_CLIENT_CRT: ${{ secrets.GLOBAL_CLIENT_CRT }}
          GLOBAL_CLIENT_KEY: ${{ secrets.GLOBAL_CLIENT_KEY }}
        run: |
          set -euo pipefail
          [ -n "${GLOBAL_CLIENT_CRT:-}" ] && [ -n "${GLOBAL_CLIENT_KEY:-}" ] || {
            echo "::error::set the GLOBAL_CLIENT_CRT and GLOBAL_CLIENT_KEY repository secrets"
            exit 1
          }
          mkdir -p certs
          printf '%s\n' "$GLOBAL_CLIENT_CRT" > certs/global_client.crt
          printf '%s\n' "$GLOBAL_CLIENT_KEY" > certs/global_client.key

      - name: Update Cargo.toml workspace version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          sed -i -E "0,/^version = \".*\"/s//version = \"${VERSION}\"/" Cargo.toml
          python3 -c "
          import re, os
          v = os.environ['VERSION']
          with open('Cargo.lock', 'r') as f:
              content = f.read()
          content = re.sub(r'(name = \"emsui-[^\"]+\"\nversion = )\"[^\"]+\"', rf'\g<1>\"{v}\"', content)
          with open('Cargo.lock', 'w') as f:
              f.write(content)
          "

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          MAJOR="$(echo "$VERSION" | cut -d. -f1)"
          MINOR="$(echo "$VERSION" | cut -d. -f2)"
          TAGS="${IMAGE_NAME}:latest,${IMAGE_NAME}:v${VERSION},${IMAGE_NAME}:${VERSION},${IMAGE_NAME}:${MAJOR}.${MINOR},${IMAGE_NAME}:${MAJOR},${IMAGE_NAME}:${GITHUB_SHA}"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/emsui-livecheck/Dockerfile
          push: true
          build-args: VERSION=${{ needs.prepare.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
