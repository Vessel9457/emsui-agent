# Release for the private Forgejo repo `Delnegend/emsui-agent`.
#
# The Forgejo `bump-version` workflow owns the version: it creates the
# `vX.Y.Z` tag and dispatches here with that tag as `ref`. This workflow
# never computes versions or creates tags — it only resolves the given tag
# to a version string. Artifacts (CLI binaries and emsui-livecheck container
# image) are built here and published to Vessel9457's GitHub Releases and
# GitHub Container Registry (ghcr.io).
# The Forgejo action mirrors the binary release back to Forgejo.

name: release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Forgejo release tag (e.g. v0.2.0)
        required: true''
      correlation_id:
        description: Caller correlation id (echoed in the run name)
        required: false

run-name: "release ${{ inputs.correlation_id || github.sha }}"

# Serialise releases so tag creation cannot collide.
concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  FJ_HOST: git.delnegend.com
  FJ_OWNER: Delnegend
  BINARY_PREFIX: emsui-agent
  IMAGE_NAME: ghcr.io/vessel9457/emsui-livecheck

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      target_ref: ${{ steps.version.outputs.target_ref }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - name: Fetch source from Forgejo
        uses: Vessel9457/actions/checkout@v2
        with:
          token: ${{ secrets.FORGEJO }}
          repository: ${{ env.FJ_OWNER }}/${{ github.event.repository.name }}
          server_url: https://${{ env.FJ_HOST }}
          path: src
          ref: ${{ inputs.ref }}


      - name: Resolve Version from release tag
        id: version
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail

          # The Forgejo `bump-version` workflow always dispatches with the
          # release tag (e.g. v0.2.0). Anything else is a caller error.
          if echo "$INPUT_REF" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            VER="${INPUT_REF#v}"
            echo "version=$VER" >> "$GITHUB_OUTPUT"
            echo "target_ref=${INPUT_REF}" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "resolved version: $VER (from input ref $INPUT_REF)"
            exit 0
          fi

          echo "::error::release ref must be a version tag (e.g. v0.2.0), got '${INPUT_REF}'"
          exit 1

  build:
    name: Build Binaries (x86_64-unknown-linux-musl)
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch source from Forgejo
        uses: Vessel9457/actions/checkout@v2
        with:
          token: ${{ secrets.FORGEJO }}
          repository: ${{ env.FJ_OWNER }}/${{ github.event.repository.name }}
          server_url: https://${{ env.FJ_HOST }}
          ref: ${{ needs.prepare.outputs.target_ref }}

      - name: Write Global CA client identity
        env:
          GLOBAL_CLIENT_CRT: ${{ secrets.GLOBAL_CLIENT_CRT }}
          GLOBAL_CLIENT_KEY: ${{ secrets.GLOBAL_CLIENT_KEY }}
        run: |
          set -euo pipefail
          [ -n "${GLOBAL_CLIENT_CRT:-}" ] && [ -n "${GLOBAL_CLIENT_KEY:-}" ] || {
            echo "::error::set the GLOBAL_CLIENT_CRT and GLOBAL_CLIENT_KEY repository secrets"
            exit 1
          }
          mkdir -p .certs
          printf '%s\n' "$GLOBAL_CLIENT_CRT" > .certs/global_client.crt
          printf '%s\n' "$GLOBAL_CLIENT_KEY" > .certs/global_client.key

      - name: Update Cargo.toml workspace version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          sed -i -E "0,/^version = \".*\"/s//version = \"${VERSION}\"/" Cargo.toml
          python3 -c "
          import re, os
          v = os.environ['VERSION']
          with open('Cargo.lock', 'r') as f:
              content = f.read()
          content = re.sub(r'(name = \"emsui-[^\"]+\"\nversion = )\"[^\"]+\"', rf'\g<1>\"{v}\"', content)
          with open('Cargo.lock', 'w') as f:
              f.write(content)
          "

      - name: Install clang + mold + musl toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends clang mold musl-tools
          sudo ln -sf /usr/bin/musl-gcc /usr/local/bin/x86_64-linux-musl-gcc

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-musl

      - name: Synchronize Cargo.lock
        run: |
          set -euo pipefail
          cargo check --workspace --target x86_64-unknown-linux-musl

      - name: Build
        env:
          RUSTFLAGS: "-C linker=clang -C link-arg=--target=x86_64-unknown-linux-musl -C link-arg=-fuse-ld=mold"
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          set -euo pipefail
          cargo build --workspace --release --target x86_64-unknown-linux-musl \
            --message-format=json-render-diagnostics > cargo-build.json

      - name: Package
        run: |
          set -euo pipefail
          BASE="${BINARY_PREFIX}-${{ needs.prepare.outputs.version }}-linux-musl"
          mkdir -p "$BASE"
          jq -r 'select(.reason == "compiler-artifact" and .executable != null) | .executable' \
            cargo-build.json | sort -u | while read -r exe; do
              cp "$exe" "$BASE/"
            done
          tar -czf "${BASE}.tar.gz" "$BASE"
          rm -rf "$BASE"
          ls -lh "${BASE}.tar.gz"
          echo "ASSET=${BASE}.tar.gz" >> "$GITHUB_ENV"


      - name: Create GitHub Release on Vessel9457
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: v${{ needs.prepare.outputs.version }}
          TARGET_REF: ${{ needs.prepare.outputs.target_ref }}
        run: |
          set -euo pipefail
          # The workspace's `origin` points at Forgejo, so `gh` cannot infer the
          # repository — pass it explicitly.
          gh release create "$VERSION" "${ASSET}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "$VERSION" \
            --notes "To be disclosed"

  publish-image:
    name: Publish Container Image (ghcr.io)
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Fetch source from Forgejo
        uses: Vessel9457/actions/checkout@v2
        with:
          token: ${{ secrets.FORGEJO }}
          repository: ${{ env.FJ_OWNER }}/${{ github.event.repository.name }}
          server_url: https://${{ env.FJ_HOST }}
          ref: ${{ needs.prepare.outputs.target_ref }}

      - name: Write Global CA client identity
        env:
          GLOBAL_CLIENT_CRT: ${{ secrets.GLOBAL_CLIENT_CRT }}
          GLOBAL_CLIENT_KEY: ${{ secrets.GLOBAL_CLIENT_KEY }}
        run: |
          set -euo pipefail
          [ -n "${GLOBAL_CLIENT_CRT:-}" ] && [ -n "${GLOBAL_CLIENT_KEY:-}" ] || {
            echo "::error::set the GLOBAL_CLIENT_CRT and GLOBAL_CLIENT_KEY repository secrets"
            exit 1
          }
          mkdir -p .certs
          printf '%s\n' "$GLOBAL_CLIENT_CRT" > .certs/global_client.crt
          printf '%s\n' "$GLOBAL_CLIENT_KEY" > .certs/global_client.key

      - name: Update Cargo.toml workspace version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          sed -i -E "0,/^version = \".*\"/s//version = \"${VERSION}\"/" Cargo.toml
          python3 -c "
          import re, os
          v = os.environ['VERSION']
          with open('Cargo.lock', 'r') as f:
              content = f.read()
          content = re.sub(r'(name = \"emsui-[^\"]+\"\nversion = )\"[^\"]+\"', rf'\g<1>\"{v}\"', content)
          with open('Cargo.lock', 'w') as f:
              f.write(content)
          "

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          # Only two tags are published: `latest` and the full semver.
          TAGS="${IMAGE_NAME}:latest,${IMAGE_NAME}:${VERSION}"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/emsui-livecheck/Dockerfile
          push: true
          build-args: VERSION=${{ needs.prepare.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
